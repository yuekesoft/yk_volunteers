{template 'common/header'}
<div class="panel panel-default">
    <div class="panel-heading"><strong>系统数据管理</strong></div>
    <div class="panel-body">

        <p>⚠️ 请谨慎操作，部分操作不可恢复！</p>

        <button id="clearVolunteersBtn" class="btn btn-danger" style="margin-right:10px;">
            <i class="fa fa-trash"></i> 清空家长数据
        </button>

        <button id="clearAssignmentsBtn" class="btn btn-warning" style="margin-right:10px;">
            <i class="fa fa-trash-o"></i> 清空自动排班表
        </button>

        <button id="resetTotalAssignedBtn" class="btn btn-info" style="margin-right:10px;">
            <i class="fa fa-refresh"></i> 家长总安排次数归零
        </button>

        <hr>

        <!-- 节假日设置 -->
        <h4><i class="fa fa-calendar"></i> 节假日设置</h4>
        <form id="holidayForm" class="form-inline" style="margin-bottom:15px;">
            <input type="hidden" name="op" value="save_holidays">
            <div class="form-group" style="width:70%;">
                <label>节假日日期（用英文逗号分隔，例如：2025-01-01,2025-02-09）</label>
                <input type="text" class="form-control" name="holidays" value="{$holidays_str}" style="width:100%;">
            </div>
            <button type="submit" class="btn btn-success" style="margin-left:10px;margin-top:20px;">
                <i class="fa fa-save"></i> 保存
            </button>
        </form>

        <!-- 节假日通知设置 -->
        <h4><i class="fa fa-bell"></i> 节假日通知设置</h4>
        <form id="holidayNoticeForm" class="form-inline">
            <input type="hidden" name="op" value="save_holiday_notice">
            <div class="form-group" style="width:70%;">
                {php echo tpl_ueditor('notice',$holiday_notice);}
            </div>
            <button type="submit" class="btn btn-success" style="margin-left:10px;margin-top:20px;">
                <i class="fa fa-save"></i> 保存
            </button>
        </form>

        <!-- ✅ 自动排班分页数量 -->
        <h4><i class="fa fa-calendar"></i> 自动排班页面每页显示数量设置</h4>
        <form id="auto_assign_page_sizeForm" class="form-inline" style="margin-bottom:15px;">
            <input type="hidden" name="op" value="save_auto_assign_page_size">
            <div class="form-group" style="width:70%;">
                <input type="number" name="auto_assign_page_size" value="{$auto_assign_page_size}" class="form-control" min="20" style="width:100%;">
            </div>
            <button type="submit" class="btn btn-success" style="margin-left:10px;">
                <i class="fa fa-save"></i> 保存
            </button>
        </form>

        <hr>

        <!-- 时段名称设置 -->
        <h4><i class="fa fa-clock-o"></i> 时段名称设置</h4>
        <form id="slotForm">
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>标识</th>
                        <th>显示名称</th>
                    </tr>
                </thead>
                <tbody>
                    {loop $slot_labels $key $value}
                    <tr>
                        <td>{$key}</td>
                        <td><input type="text" name="slot_labels[{$key}]" value="{$value}" class="form-control"></td>
                    </tr>
                    {/loop}
                </tbody>
            </table>
            <button type="button" id="saveSlotBtn" class="btn btn-info">保存时段名称设置</button>
        </form>

    </div>
</div>

<div class="panel panel-default">
    <div class="panel-heading"><strong>家长扫码签到有效时间段设置</strong></div>
    <div class="panel-body">
        <form id="slotTimesForm" class="form-horizontal">
            <div class="form-inline" style="display:flex; gap:15px; align-items:center; flex-wrap:wrap;">
                <div>
                    <label>早上 (Morning)</label>
                    <input type="time" name="slot_times[morning][start]" value="<?php echo $slot_times['morning']['start'];?>" class="form-control"> ~
                    <input type="time" name="slot_times[morning][end]" value="<?php echo $slot_times['morning']['end'];?>" class="form-control">
                </div>
                <div>
                    <label>傍晚 (Afternoon)</label>
                    <input type="time" name="slot_times[afternoon][start]" value="<?php echo $slot_times['afternoon']['start'];?>" class="form-control"> ~
                    <input type="time" name="slot_times[afternoon][end]" value="<?php echo $slot_times['afternoon']['end'];?>" class="form-control">
                </div>
                <div>
                    <label>晚上 (Evening)</label>
                    <input type="time" name="slot_times[evening][start]" value="<?php echo $slot_times['evening']['start'];?>" class="form-control"> ~
                    <input type="time" name="slot_times[evening][end]" value="<?php echo $slot_times['evening']['end'];?>" class="form-control">
                </div>
                <div>
                    <button type="button" id="saveSlotTimesBtn" class="btn btn-primary">保存设置</button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
    $(function() {
        // 清空家长数据
        $('#clearVolunteersBtn').click(function() {
            if (!confirm('确认要清空所有家长数据吗？此操作不可恢复！')) return;

            $.post("{php echo $this->createWebUrl('sysset', array('op'=>'clear_volunteers'));}", {}, function(res) {
                try {
                    var data = JSON.parse(res);
                    alert(data.msg);
                    if (data.status == 1) location.reload();
                } catch (e) {
                    console.log(res);
                    alert('操作失败');
                }
            });
        });

        // 清空自动排班表
        $('#clearAssignmentsBtn').click(function() {
            if (!confirm('确认要清空所有自动排班记录吗？此操作不可恢复！')) return;

            $.post("{php echo $this->createWebUrl('sysset', array('op'=>'clear_assignments'));}", {}, function(res) {
                try {
                    var data = JSON.parse(res);
                    alert(data.msg);
                    if (data.status == 1) location.reload();
                } catch (e) {
                    console.log(res);
                    alert('操作失败');
                }
            });
        });

        // 家长总安排次数归零
        $('#resetTotalAssignedBtn').click(function() {
            if (!confirm('确认要将所有家长的总安排次数归零吗？')) return;

            $.post("{php echo $this->createWebUrl('sysset', array('op'=>'reset_total_assigned'));}", {}, function(res) {
                try {
                    var data = JSON.parse(res);
                    alert(data.msg);
                    if (data.status == 1) location.reload();
                } catch (e) {
                    console.log(res);
                    alert('操作失败');
                }
            });
        });

        // 保存节假日设置
        $('#holidayForm').submit(function(e) {
            e.preventDefault();
            var holidays = $(this).find('input[name=holidays]').val();
            $.post("{php echo $this->createWebUrl('sysset'); }", {
                op: 'save_holidays',
                holidays: holidays
            }, function(res) {
                try {
                    var data = JSON.parse(res);
                    alert(data.msg);
                } catch (e) {
                    console.log(res);
                    alert('操作失败');
                }
            });
        });

        // 保存节假日通知
        $('#holidayNoticeForm').submit(function(e) {
            e.preventDefault();
            var content = '';
            try {
                if (typeof UE !== 'undefined' && UE.getEditor('notice')) {
                    content = UE.getEditor('notice').getContent();
                } else {
                    content = $(this).find('textarea').val() || '';
                }
            } catch (err) {
                content = $(this).find('textarea').val() || '';
            }
            $.post("{php echo $this->createWebUrl('sysset'); }", {
                op: 'save_holiday_notice',
                notice: content
            }, function(res) {
                try {
                    var data = JSON.parse(res);
                    alert(data.msg);
                } catch (e) {
                    console.log(res);
                    alert('操作失败');
                }
            });
        });

        // 保存自动排班分页显示数量
        $('#auto_assign_page_sizeForm').submit(function(e) {
            e.preventDefault();
            var auto_assign_page_size = $(this).find('input[name=auto_assign_page_size]').val();
            $.post("{php echo $this->createWebUrl('sysset'); }", {
                op: 'save_auto_assign_page_size',
                pagesize: auto_assign_page_size
            }, function(res) {
                try {
                    var data = JSON.parse(res);
                    alert(data.msg);
                } catch (e) {
                    console.log(res);
                    alert('操作失败');
                }
            });
        });

        // 保存时段名称
        $('#saveSlotBtn').click(function() {
            $.post("{php echo $this->createWebUrl('sysset', ['op'=>'save_slots']);}", $('#slotForm').serialize(), function(res) {
                alert(JSON.parse(res).msg);
            });
        });

    });
</script>

<!-- 保存扫码时段 -->
<script>
    $(document).ready(function() {
        $('#saveSlotTimesBtn').click(function() {
            var formData = $('#slotTimesForm').serialize();

            $.post("<?php echo $this->createWebUrl('sysset', ['op'=>'save_slot_times']); ?>", formData, function(res) {
                try {
                    var data = JSON.parse(res);
                    if (data.status == 1) {
                        alert('保存成功');
                    } else {
                        alert('保存失败：' + data.msg);
                    }
                } catch (e) {
                    console.error(res);
                    alert('保存失败，请重试');
                }
            });
        });
    });
</script>

{template 'common/footer'}
