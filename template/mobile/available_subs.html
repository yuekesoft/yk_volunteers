<!-- available_subs.html -->
{template 'common/header'}

<div class="panel panel-default">
    <div class="panel-heading" style="display:flex; justify-content:space-between; align-items:center;">
        <span>可替班任务</span>
        <button class="btn btn-primary btn-sm" onclick="location.href='<?php echo $this->createMobileUrl('assignments_list')?>'">
            返回排班列表
        </button>
    </div>

    <div class="panel-body">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>日期</th>
                    <th>时段</th>
                    <th>原家长</th>
                    <th>班级</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <?php if (!empty($list)) { foreach ($list as $row) { ?>
                <tr>
                    <td>
                        <?php echo $row['date'];?>
                    </td>
                    <td>
                        {if $row['slot_code']=='morning'}早上 {elseif $row['slot_code']=='afternoon'}傍晚 {elseif $row['slot_code']=='evening'}晚上 {else}{$row['slot_code']}{/if}
                    </td>
                    <td>
                        <?php echo $row['volunteer_name'];?>
                    </td>
                    <td>
                        <?php echo $row['child_class'];?>
                    </td>
                    <td>
                        <button class="btn btn-success btn-replace" data-id="<?php echo $row['id'];?>">我要替班</button>
                    </td>
                </tr>
                <?php } } else { ?>
                <tr>
                    <td colspan="4">暂无待替班任务</td>
                </tr>
                <?php } ?>
            </tbody>
        </table>
    </div>
</div>

<script>
    require(['jquery'], function($) {
        $('.btn-replace').on('click', function() {
            if (!confirm('确认要替班吗？')) return;

            var $btn = $(this); // 当前按钮
            var id = $btn.data('id');

            // 禁用按钮，防止重复点击
            $btn.prop('disabled', true);
            var originalText = $btn.text();
            $btn.html('<i class="fa fa-spinner fa-spin"></i> 正在替班…');

            $.post("<?php echo $this->createMobileUrl('replace')?>", {
                schedule_id: id
            }, function(resp) {
                if (resp.message) alert(resp.message);
                if (resp.status == 0) {
                    location.reload();
                } else {
                    // 操作失败恢复按钮
                    $btn.prop('disabled', false);
                    $btn.html(originalText);
                }
            }, 'json').fail(function() {
                // 网络异常恢复按钮
                $btn.prop('disabled', false);
                $btn.html(originalText);
                alert('网络异常，请重试');
            });
        });

    });
</script>

{template 'common/footer'}
