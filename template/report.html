{template 'common/header'}
<!-- report.html -->
<div class="panel panel-default">
    <div class="panel-body">

        <!-- 标签页导航 -->
        <ul class="nav nav-tabs">
            <li class="{if $tab == 'tab_detail'}active{/if}">
                <a href="#tab_detail" data-toggle="tab"><i class="fa fa-list"></i> 签到明细统计</a>
            </li>
            <li class="{if $tab == 'tab_summary'}active{/if}">
                <a href="#tab_summary" data-toggle="tab"><i class="fa fa-users"></i> 家长签到次数统计</a>
            </li>
        </ul>

        <div class="tab-content" style="padding-top:15px;">
            <!-- ✅ 签到明细 tab -->
            <div class="tab-pane {if $tab == 'tab_detail'}active{/if}" id="tab_detail">
                <form id="form_detail" method="post" action="{php echo $this->createWebUrl('report');}">
                    <input type="hidden" name="tab" value="tab_detail">

                    <div class="form-inline" style="margin-bottom:15px;">
                        <label>开始日期：</label>
                        <input type="date" class="form-control" name="start_date" value="{$start_date}">
                        <label>结束日期：</label>
                        <input type="date" class="form-control" name="end_date" value="{$end_date}">
                        <button type="submit" class="btn btn-primary">查询</button>

                        <!-- ✅ 改为 data-base-url 自动更新的导出按钮 -->
                        <a id="export_detail" class="btn btn-success" data-base-url="<?php echo $this->createWebUrl('report',['op'=>'export','tab'=>'tab_detail']); ?>">
                            <i class="fa fa-file-excel-o"></i> 导出签到明细
                        </a>
                    </div>

                    <div class="tab-data">
                        {template 'report_detail_list'}
                    </div>
                </form>
            </div>

            <!-- ✅ 家长统计 tab -->
            <div class="tab-pane {if $tab == 'tab_summary'}active{/if}" id="tab_summary">
                <form id="form_summary" method="post" action="{php echo $this->createWebUrl('report');}">
                    <input type="hidden" name="tab" value="tab_summary">

                    <div class="form-inline" style="margin-bottom:15px;">
                        <label>开始日期：</label>
                        <input type="date" class="form-control" name="start_date" value="{$start_date}">
                        <label>结束日期：</label>
                        <input type="date" class="form-control" name="end_date" value="{$end_date}">
                        <button type="submit" class="btn btn-primary">查询</button>

                        <!-- ✅ 改为 data-base-url 自动更新的导出按钮 -->
                        <a id="export_summary" class="btn btn-success" data-base-url="<?php echo $this->createWebUrl('report',['op'=>'export','tab'=>'tab_summary']); ?>">
                            <i class="fa fa-download"></i> 导出签到汇总
                        </a>
                    </div>

                    <div class="tab-data">
                        {template 'report_summary_list'}
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- ✅ JS：表单 + 分页 + 导出链接日期同步 -->
<script>
    $(document).ready(function() {

        // ==========【封装函数：加载tab数据】==========
        function loadTabData($form, url = null) {
            var $tabData = $form.find('.tab-data');
            var action = url || $form.attr('action');
            var formData = $form.serialize();
            $tabData.html('<div class="text-center text-muted p-4">加载中，请稍候...</div>');

            $.post(action, formData, function(res) {
                $tabData.html(res);
            }).fail(function() {
                $tabData.html('<div class="text-danger p-3">加载失败，请稍后重试。</div>');
            });
        }

        // ==========【表单提交 AJAX 加载】==========
        $('.tab-pane form').on('submit', function(e) {
            e.preventDefault();
            loadTabData($(this));
            updateExportLinks(); // 查询后也更新导出链接
        });

        // ==========【分页 AJAX 加载】==========
        $(document).on('click', '.pagination a', function(e) {
            e.preventDefault();
            var url = $(this).attr('href');
            if (!url || url === '#') return;
            var $form = $(this).closest('.tab-pane').find('form');
            loadTabData($form, url);
        });

        // ==========【Tab 切换时保存状态】==========
        $('a[data-toggle="tab"]').on('shown.bs.tab', function(e) {
            var target = $(e.target).attr('href');
            $('input[name="tab"]').val(target.replace('#', ''));
            updateExportLinks(); // 切换tab时同步导出链接
        });

        // ==========【导出链接自动更新部分】==========
        function updateExportLinks() {
            // 明细
            var $form1 = $('#form_detail');
            var $link1 = $('#export_detail');
            if ($form1.length && $link1.length) {
                var start1 = $form1.find('input[name="start_date"]').val();
                var end1 = $form1.find('input[name="end_date"]').val();
                updateHref($link1, start1, end1);
            }

            // 汇总
            var $form2 = $('#form_summary');
            var $link2 = $('#export_summary');
            if ($form2.length && $link2.length) {
                var start2 = $form2.find('input[name="start_date"]').val();
                var end2 = $form2.find('input[name="end_date"]').val();
                updateHref($link2, start2, end2);
            }
        }

        // ==========【更新某个链接的href】==========
        function updateHref($link, start, end) {
            var base = $link.data('base-url');
            if (!base) return;
            base = base.replace(/(&|\?)start_date=[^&]*/g, '').replace(/(&|\?)end_date=[^&]*/g, '');
            var sep = base.indexOf('?') === -1 ? '?' : '&';
            var params = [];
            if (start) params.push('start_date=' + encodeURIComponent(start));
            if (end) params.push('end_date=' + encodeURIComponent(end));
            var href = base + (params.length ? sep + params.join('&') : '');
            $link.attr('href', href);
        }

        // ==========【日期输入变化自动更新链接】==========
        $(document).on('change', 'input[name="start_date"], input[name="end_date"]', function() {
            updateExportLinks();
        });

        // 初始化执行一次
        updateExportLinks();
    });
</script>

{template 'common/footer'}
